<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Quiz - Ruangan Game</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #12121f; color: white; overflow-x: hidden; }
        
        /* Header Informasi Ruangan & Status */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1f1f35; padding: 10px 20px; border-bottom: 2px solid #00d2ff; }
        .badge { background: #2d2d4d; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; }

        /* Tombol Respawn di Pojok Kanan Tengah (Sesuai Permintaan) */
        #btnRespawn {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: #ff4757;
            color: white;
            border: 3px solid white;
            padding: 15px 18px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5);
            z-index: 100;
            text-align: center;
        }
        #btnRespawn:hover { background: #ff6b81; transform: translateY(-50%) scale(1.05); }

        /* Layout Utama Game (Kiri: Tower, Kanan: Panel Kuis) */
        .game-layout { display: flex; height: calc(100vh - 55px); }
        
        .tower-area {
            flex: 1;
            background: linear-gradient(to top, #1e272e, #2f3542, #3742fa);
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            padding-bottom: 20px;
            overflow-y: auto;
        }
        .platform {
            width: 150px;
            height: 22px;
            background: #70a1ff;
            margin: 18px 0;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #1e272e;
            position: relative;
        }
        .platform.checkpoint { background: #2ed573; border: 2px solid white; color: white; }
        .platform.finish { background: #ffa502; width: 190px; color: #12121f; }
        
        #playerAvatar {
            font-size: 26px;
            position: absolute;
            top: -30px;
            transition: all 0.3s ease;
        }

        .control-area { flex: 1; padding: 25px; background: #19192b; overflow-y: auto; }
        .box { background: #252540; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 6px; border: none; }
        button.action-btn { background: #00d2ff; color: #12121f; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .option-btn { display: block; width: 100%; text-align: left; background: #343456; color: white; border: 2px solid #4b4b7c; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .option-btn:hover { background: #4b4b7c; }

        /* Pop-up Meme ala Quizizz */
        #memeModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            justify-content: center; align-items: center; z-index: 200; flex-direction: column; text-align: center;
        }
        #memeModal img { max-width: 280px; border-radius: 12px; border: 4px solid #00d2ff; }
    </style>
</head>
<body>

    <!-- Bar Atas: Navigasi & Info Sesi -->
    <div class="top-bar">
        <div>
            <button onclick="window.location.href='../index.html'" style="background:#57606f; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">⬅ Keluar ke Beranda</button>
            <span class="badge" style="margin-left:10px;">Ruangan: <span id="dispKode">-</span></span>
            <span class="badge">Pemain: <span id="dispNama">-</span></span>
        </div>
        <div>
            <span class="badge" style="color:#ffa502;">⏱️ Waktu: <span id="timerDisplay">60</span>s</span>
            <span class="badge" style="color:#2ed573;">🦘 Poin Lompat: <span id="poinLompat">0</span></span>
            <span class="badge" style="color:#00d2ff;">🏆 Nilai: <span id="nilaiAkhir">0</span>/100</span>
        </div>
    </div>

    <!-- Tombol Respawn di Pojok Kanan Tengah -->
    <button id="btnRespawn" onclick="respawnPemain()" title="Kembali ke Checkpoint terakhir jika jatuh">
        🔄 RESPAWN<br><small>(Checkpoint)</small>
    </button>

    <div class="game-layout">
        <!-- Area Visual Menara Kiri -->
        <div class="tower-area" id="towerContainer"></div>

        <!-- Area Kuis & Kontrol Kanan -->
        <div class="control-area">
            
            <!-- Panel Guru (Akan otomatis disembunyikan jika yang login siswa, atau tetap tampil jika mode guru) -->
            <div class="box" id="panelGuru">
                <h3>🧑‍🏫 Panel Guru (Pengaturan Soal)</h3>
                <label>Atur Durasi Waktu (Detik):</label>
                <input type="number" id="inputWaktu" value="90" min="10">
                
                <label>Pertanyaan Kuis:</label>
                <input type="text" id="inputSoal" placeholder="Contoh: Berapa hasil 12 x 8?">
                
                <label>Pilihan Jawaban (Pisahkan koma, jawaban benar di PERTAMA):</label>
                <input type="text" id="inputOpsi" placeholder="Contoh: 96, 84, 108, 92">
                
                <button class="action-btn" onclick="tambahSoal()">+ Tambah Soal</button>
                <button class="action-btn" style="background:#2ed573; margin-top:10px;" onclick="mulaiGame()">▶ Mulai Permainan!</button>
                <p><small>Total soal tersedia: <b id="jumlahSoal">2</b> soal.</small></p>
            </div>

            <!-- Arena Soal Siswa -->
            <div class="box" id="arenaKuis" style="display:none;">
                <h3 id="teksSoal">Menunggu soal dari guru...</h3>
                <div id="wadahOpsi"></div>
                <hr style="border-color:#343456; margin: 20px 0;">
                <button class="action-btn" style="background:#ffa502;" onclick="lompatKeAtas()">
                    ⬆️ Gunakan 1 Poin untuk Melompat! (Sisa Poin: <span id="btnSisaPoin">0</span>)
                </button>
                <button class="action-btn" style="background:#ff4757; color:white; margin-top:8px;" onclick="simulasiJatuh()">
                    💥 Simulasi Terpleset / Jatuh
                </button>
            </div>

            <!-- Panel Hasil Akhir -->
            <div class="box" id="panelHasil" style="display:none; text-align:center;">
                <h2>🎉 Permainan Selesai!</h2>
                <p id="ringkasanHasil"></p>
                <h1 style="font-size:48px; color:#00d2ff;" id="skorFinalBesar">0</h1>
                <button class="action-btn" onclick="window.location.href='../index.html'">Kembali ke Beranda</button>
            </div>

        </div>
    </div>

    <!-- Modal Meme Quizizz -->
    <div id="memeModal">
        <img id="memeImg" src="" alt="Meme">
        <h2 id="memeText" style="margin-top:15px;"></h2>
    </div>

    <script>
        // Ambil data identitas yang dikirim dari Home Page
        const kodeRuangan = localStorage.getItem('kodeRuanganAktif') || 'ROOM-DEMO';
        const namaPemain = localStorage.getItem('namaPemain') || 'Tamu / Guru';
        const roleGuru = localStorage.getItem('roleGuru');

        document.getElementById('dispKode').innerText = kodeRuangan;
        document.getElementById('dispNama').innerText = namaPemain;

        // Jika yang masuk adalah siswa, kita langsung sembunyikan panel input soal guru agar mereka langsung main
        if (!roleGuru && localStorage.getItem('namaPemain')) {
            // Otomatis langsung mulai game untuk siswa
            setTimeout(() => { mulaiGame(); }, 500);
        }

        let daftarSoal = [
            { tanya: "Ibu kota negara Indonesia yang baru adalah...", opsi: ["Nusantara", "Jakarta", "Bandung", "Surabaya"], benar: "Nusantara" },
            { tanya: "Hasil dari 15 + 25 x 2 adalah...", opsi: ["65", "80", "55", "70"], benar: "65" }
        ];

        const memeBenar = [
            { img: "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif", text: "MANTAP! +2 Poin Lompatan!" },
            { img: "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif", text: "JENIUS! Lanjut panjat menaranya!" }
        ];
        const memeSalah = [
            { img: "https://media.giphy.com/media/3o6wrebnKWmvx4ZBio/giphy.gif", text: "YAH SALAH! 0 Poin, coba lagi!" },
            { img: "https://media.giphy.com/media/l2JhtKtDWYNKdRpoA/giphy.gif", text: "HAMPIR BENAR! Tetap semangat!" }
        ];

        const totalLantai = 10;
        let posisiSekarang = 0;
        let posisiCheckpoint = 0;
        let poinLompat = 0;
        let soalIndex = 0;
        let jawabanBenarCount = 0;
        let waktuTersisa = 90;
        let timerInterval;
        let sudahSelesai = false;

        function renderMenara() {
            const container = document.getElementById('towerContainer');
            container.innerHTML = '';
            for (let i = 0; i <= totalLantai; i++) {
                const div = document.createElement('div');
                div.className = 'platform';
                
                if (i === 0) div.innerText = "START (Dasar)";
                else if (i === totalLantai) {
                    div.classList.add('finish');
                    div.innerText = "👑 PUNCAK MENARA";
                } else if (i % 3 === 0) {
                    div.classList.add('checkpoint');
                    div.innerText = `🚩 CHECKPOINT ${i}`;
                } else {
                    div.innerText = `Lantai ${i}`;
                }

                if (i === posisiSekarang) {
                    const avatar = document.createElement('div');
                    avatar.id = 'playerAvatar';
                    avatar.innerText = '🏃‍♂️';
                    div.appendChild(avatar);
                }
                container.appendChild(div);
            }
        }

        function tambahSoal() {
            const tanya = document.getElementById('inputSoal').value;
            const opsiRaw = document.getElementById('inputOpsi').value.split(',').map(item => item.trim());
            if (!tanya || opsiRaw.length < 2) {
                alert("Isi pertanyaan dan minimal 2 pilihan jawaban!");
                return;
            }
            daftarSoal.push({ tanya: tanya, opsi: opsiRaw, benar: opsiRaw[0] });
            document.getElementById('jumlahSoal').innerText = daftarSoal.length;
            document.getElementById('inputSoal').value = '';
            document.getElementById('inputOpsi').value = '';
            alert("Soal berhasil ditambahkan!");
        }

        function mulaiGame() {
            waktuTersisa = parseInt(document.getElementById('inputWaktu').value) || 90;
            document.getElementById('timerDisplay').innerText = waktuTersisa;
            document.getElementById('panelGuru').style.display = 'none';
            document.getElementById('arenaKuis').style.display = 'block';
            
            renderMenara();
            tampilkanSoal();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                waktuTersisa--;
                document.getElementById('timerDisplay').innerText = waktuTersisa;
                if (waktuTersisa <= 0) akhiriPermainan(false);
            }, 1000);
        }

        function tampilkanSoal() {
            const soal = daftarSoal[soalIndex % daftarSoal.length];
            document.getElementById('teksSoal').innerText = `Soal #${soalIndex + 1}: ${soal.tanya}`;
            
            const opsiAcak = [...soal.opsi].sort(() => Math.random() - 0.5);
            const wadah = document.getElementById('wadahOpsi');
            wadah.innerHTML = '';

            opsiAcak.forEach(pilihan => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = pilihan;
                btn.onclick = () => cekJawaban(pilihan, soal.benar);
                wadah.appendChild(btn);
            });
        }

        function cekJawaban(dipilih, kunci) {
            const modal = document.getElementById('memeModal');
            const img = document.getElementById('memeImg');
            const txt = document.getElementById('memeText');

            if (dipilih === kunci) {
                poinLompat += 2; // Benar = +2 Poin
                jawabanBenarCount++;
                const m = memeBenar[Math.floor(Math.random() * memeBenar.length)];
                img.src = m.img;
                txt.innerText = m.text;
                txt.style.color = "#2ed573";
            } else {
                // Salah = 0 poin
                const m = memeSalah[Math.floor(Math.random() * memeSalah.length)];
                img.src = m.img;
                txt.innerText = m.text;
                txt.style.color = "#ff4757";
            }

            updateUI();
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.display = 'none';
                soalIndex++;
                tampilkanSoal();
            }, 1800);
        }

        function lompatKeAtas() {
            if (poinLompat <= 0) {
                alert("Poin lompatan habis! Jawab soal dengan benar untuk mendapatkan 2 poin.");
                return;
            }
            poinLompat -= 1;
            posisiSekarang += 1;

            if (posisiSekarang % 3 === 0 && posisiSekarang < totalLantai) {
                posisiCheckpoint = posisiSekarang;
            }

            renderMenara();
            updateUI();

            if (posisiSekarang >= totalLantai) {
                akhiriPermainan(true);
            }
        }

        function simulasiJatuh() {
            posisiSekarang = 0;
            renderMenara();
            alert("Aduh terpeleset! Klik tombol RESPAWN di pojok kanan tengah untuk kembali ke Checkpoint.");
        }

        function respawnPemain() {
            posisiSekarang = posisiCheckpoint;
            renderMenara();
        }

        function hitungSkor0Sampai100(mencapaiPuncak) {
            const totalWaktuAwal = parseInt(document.getElementById('inputWaktu').value) || 90;
            const skorAkurasi = Math.min(50, jawabanBenarCount * 10);
            const skorKecepatan = Math.round((waktuTersisa / totalWaktuAwal) * 30);
            const bonusFinish = mencapaiPuncak ? 20 : 0;
            return Math.min(100, skorAkurasi + skorKecepatan + bonusFinish);
        }

        function updateUI() {
            document.getElementById('poinLompat').innerText = poinLompat;
            document.getElementById('btnSisaPoin').innerText = poinLompat;
            document.getElementById('nilaiAkhir').innerText = hitungSkor0Sampai100(posisiSekarang >= totalLantai);
        }

        function akhiriPermainan(mencapaiPuncak) {
            if (sudahSelesai) return;
            sudahSelesai = true;
            clearInterval(timerInterval);
            
            const skorFinal = hitungSkor0Sampai100(mencapaiPuncak);
            document.getElementById('arenaKuis').style.display = 'none';
            document.getElementById('panelHasil').style.display = 'block';
            document.getElementById('skorFinalBesar').innerText = `${skorFinal} / 100`;
            document.getElementById('ringkasanHasil').innerText = mencapaiPuncak 
                ? `Luar biasa ${namaPemain}! Kamu mencapai puncak menara dengan ${jawabanBenarCount} jawaban benar!`
                : `Waktu habis! Kamu mencapai Lantai ${posisiSekarang} dengan ${jawabanBenarCount} jawaban benar.`;
        }

        renderMenara();
    </script>
</body>
</html>
